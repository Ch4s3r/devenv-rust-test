[package]
name = "devenv-rust-test"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.15"
aws-credential-types = "1.2.8"
aws-runtime = "1.7.2"
aws-sdk-organizations = "1.96.0"
aws-sdk-eks = "1.124.0"
aws-sdk-sts = "1.101.0"
aws-smithy-http-client = { version = "1.1.12", features = ["legacy-rustls-ring"] }
aws-smithy-types = "1.4.5"
aws-types = "1.3.14"
ansi_term = "0.12.1"
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
enum-iterator = "2.3.0"
hyper-rustls = "0.24.2"
humantime = "2.3.0"
inquire = "0.7.5"
k8s-openapi = { version = "0.27.0", features = ["latest"] }
kube = { version = "3.0.1", features = ["config"] }
miette = "7.6.0"
nutype = "0.6.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["cookies", "form", "rustls"] }
roxmltree = "0.21.1"
rustls = { version = "0.21.12", features = ["dangerous_configuration"] }
rust-ini = "0.21.3"
rustls-pemfile = "2.2.0"
scraper = "0.27.0"
secrecy = "0.10.3"
secure-string = "0.3.0"
serde_yaml = "0.9.34"
serial_test = "3.4.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-forest = "0.3.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tracing-error = "0.2.1"
reqwest_cookie_store = "0.10.0"
shellexpand = "3.1.2"
rcgen = "0.14.5"
aws-lc-rs = "1.17.3"

