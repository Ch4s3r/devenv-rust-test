[package]
name = "devenv-rust-test"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.10.0"
aws-credential-types = "1.3.0"
aws-runtime = "1.9.0"
aws-sdk-organizations = "1.120.0"
aws-sdk-eks = "1.139.0"
aws-sdk-sts = "1.109.0"
aws-smithy-http-client = { version = "1.2.0", features = ["legacy-rustls-ring"] }
aws-smithy-types = "1.6.1"
aws-types = "1.5.0"
ansi_term = "0.12.1"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
enum-iterator = "2.3.0"
hyper-rustls = "0.27.9"
humantime = "2.4.0"
inquire = "0.9.4"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["config"] }
miette = "7.6.0"
nutype = "0.7.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form", "rustls"] }
roxmltree = "0.21.1"
rustls = "0.23.42"
rust-ini = "0.21.3"
rustls-pemfile = "2.2.0"
scraper = "0.27.0"
secrecy = "0.10.3"
secure-string = "0.3.0"
serde_yaml = "0.9.34"
serial_test = "3.5.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-forest = "0.3.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-error = "0.2.1"
reqwest_cookie_store = "0.10.0"
shellexpand = "3.1.2"
rcgen = "0.14.8"
