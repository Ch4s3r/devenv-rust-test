name: Cross Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -c "nix develop --impure -c bash -- {0}"
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Cross-build aarch64-apple-darwin release artifact
        run: build-aarch64-darwin
      - name: Code-sign aarch64-apple-darwin release artifact
        env:
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
        run: |
          if [ -n "$MACOS_CODESIGN_P12_BASE64" ]; then
            echo "$MACOS_CODESIGN_P12_BASE64" | base64 -d > /tmp/codesign.p12
          fi
          sign-aarch64-darwin
