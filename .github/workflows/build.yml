name: "Build"

on:
  pull_request:
  push:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest] # , macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -c "nix develop --impure -c bash -- {0}"

    steps:
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/determinate-nix-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-gha-cache: true
        use-flakehub: false

    - name: Check /nix/store size after nix install
      run: du -sh /nix/store

    - name: Run tests
      run: tests

    - name: Check /nix/store size after running tests
      run: du -sh /nix/store

    - name: Build release artifact
      run: nix build .#default

    - name: Code-sign macOS release artifact
      if: matrix.os == 'macos-latest'
      env:
        MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
      run: |
        if [ -n "$MACOS_CODESIGN_P12_BASE64" ]; then
          echo "$MACOS_CODESIGN_P12_BASE64" | base64 -d > /tmp/codesign.p12
        fi
        sign

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: devenv-rust-test-${{ matrix.os }}
        path: result/bin/devenv-rust-test
