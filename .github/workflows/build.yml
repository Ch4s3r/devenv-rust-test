name: "Test"

on:
  # disabled: superseded by cross-build.yml (ubuntu-latest + cargo-zigbuild
  # replaces the macos-latest job)
  # pull_request:
  # push:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -c "nix develop --impure -c bash -- {0}"

    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    - name: Run tests
      run: tests

    - name: Build release artifact
      run: build

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: devenv-rust-test-${{ matrix.os }}
        path: target/release/devenv-rust-test
