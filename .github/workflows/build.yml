name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Build the devenv shell, run pre-commit hooks, and run tests
        run: devenv test

      - name: Determine Nix system
        id: nix-system
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            echo "system=aarch64-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "system=x86_64-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: nix build .#packages.${{ steps.nix-system.outputs.system }}.default -o dist

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: devenv-rust-test-${{ matrix.os }}
          path: dist/bin/
